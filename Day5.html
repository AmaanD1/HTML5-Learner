<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check it!</title>
</head>
<body>
    <header>
        <h1>Progressed</h1>
    </header>
    <main>
        <section>
            <h2>Check what you Achieved</h2>
            <form>
                <h3>Front-End checklist</h3>
                <p>
                    <input type="checkbox" id="html5" name="completion" value="html5">
                    <label for="html5">HTML5</label><br>
                    <input type="checkbox" id="c-language" name="completion" value="c-language">
                    <label for="c-language">C-language</label><br>
                </p>
                <hr>
                <h3>Study routine</h3>
                <p>
                    <input type="radio" id="no-phones" name="time" value="1-routine">
                    <label for="no-phones">Phone use is less than an hour</label><br>
                    <input type="radio" id="no-timewaste" name="time" value="2-routine">
                    <label for="no-timewaste">no waste of time</label>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
